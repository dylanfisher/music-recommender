name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The service runs on macOS (launchd, Bonjour), so CI does too. The runner's
      # rustup reads rust-toolchain.toml; this installs that toolchain and its components.
      - run: rustup toolchain install

      - run: ./scripts/setup
      - run: ./scripts/check

