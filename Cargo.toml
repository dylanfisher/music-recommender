[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
publish = false

# The crates ADR 0005 approved, and the dumps' three the owner approved on 2026-11-10
# (ADR 0022). Crates reference these with `<name>.workspace = true`.
[workspace.dependencies]
flate2 = "1.1.11"
quick-xml = "0.42.0"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

# Every crate opts in with `[lints] workspace = true`. The gate runs clippy with
# `-D warnings`, so these are errors there and warnings while iterating.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
